<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kyle</title>
<style>
  :root {
    --bg: #10141a;
    --panel: #1a2029;
    --bubble-user: #2f6fed;
    --bubble-kyle: #252d38;
    --text: #e8ecf1;
    --muted: #8b95a3;
    --accent: #2f6fed;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid #2a3341;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #3ecf8e;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header span { color: var(--muted); font-size: 13px; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.45;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg .who {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }
  .kyle {
    align-self: flex-start;
    background: var(--bubble-kyle);
    border-bottom-left-radius: 4px;
  }
  .kyle.thinking { color: var(--muted); font-style: italic; }
  .error { align-self: center; color: #ff7a7a; font-size: 13px; }
  form {
    display: flex;
    gap: 10px;
    padding: 14px 20px 20px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid #2a3341;
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 12px 22px;
    border-radius: 24px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>Kyle</h1>
  <span>powered by Claude</span>
</header>

<div id="chat"></div>

<form id="composer">
  <input id="input" type="text" placeholder="Say something to Kyle…" autocomplete="off" autofocus />
  <button id="send" type="submit">Send</button>
</form>

<script>
  // Lambda Function URL (auth type NONE)
  const FUNCTION_URL = "https://ajht3pxatlnabyj54skhdmu2uy0heodw.lambda-url.us-east-1.on.aws/";

  const MAX_HISTORY = 20;
  const messages = []; // [{ role: "user" | "assistant", content: "..." }]

  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("composer");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");

  function addBubble(role, text, extraClass = "") {
    const div = document.createElement("div");
    div.className = `msg ${role === "user" ? "user" : "kyle"} ${extraClass}`.trim();
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = role === "user" ? "You" : "Kyle";
    div.appendChild(who);
    div.appendChild(document.createTextNode(text));
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function addError(text) {
    const div = document.createElement("div");
    div.className = "error";
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  addBubble("assistant", "Hey, Kyle here. Ask me anything — though reminders and timers only work on an Echo.");

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;

    if (FUNCTION_URL.startsWith("TODO")) {
      addError("Set FUNCTION_URL at the top of the <script> in this file first.");
      return;
    }

    inputEl.value = "";
    sendEl.disabled = true;
    addBubble("user", text);
    messages.push({ role: "user", content: text });

    const thinkingEl = addBubble("assistant", "thinking…", "thinking");
    try {
      const res = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: messages.slice(-MAX_HISTORY) }),
      });
      thinkingEl.remove();
      if (!res.ok) {
        const detail = await res.text().catch(() => "");
        addError(`Kyle hit an error (HTTP ${res.status}). ${detail}`);
        return;
      }
      const data = await res.json();
      const reply = data.reply || "…";
      messages.push({ role: "assistant", content: reply });
      addBubble("assistant", reply);
    } catch (err) {
      thinkingEl.remove();
      addError(`Couldn't reach Kyle: ${err.message}`);
    } finally {
      sendEl.disabled = false;
      inputEl.focus();
    }
  });
</script>
</body>
</html>
